name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - run: uv sync --frozen --python "${{ steps.python.outputs.python-path }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run --frozen python scripts/check.py
      - name: Test Google workflow with mock services
        working-directory: google
        run: npm test
